# Single-installation development topology. Not a high-availability claim.
name: assureops
services:
  postgres:
    image: postgres:16.4
    env_file: dev.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    ports: ["127.0.0.1:5441:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7.4.1
    ports: ["127.0.0.1:6391:6379"]
    # Append-only persistence: portal sessions and queued intents survive a Redis restart (PostgreSQL stays the source of truth).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports: ["127.0.0.1:8780:8080"]
    volumes:
      - ./keycloak/realm-assureops.rendered.json:/opt/keycloak/data/import/realm-assureops.json:ro
      - ./keycloak/realm-assureops-staff.rendered.json:/opt/keycloak/data/import/realm-assureops-staff.json:ro
      - ./keycloak/themes/assureops:/opt/keycloak/themes/assureops:ro  # sign-in pages in the portal theme
  # Private S3-compatible evidence store (SeaweedFS, Apache-2.0). One authenticated identity, no anonymous access.
  objectstore:
    image: chrislusf/seaweedfs:3.80
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=0", "-master.volumeSizeLimitMB=256"]
    ports: ["127.0.0.1:9100:8333"]
    volumes:
      - objdata:/data
      - ./seaweedfs/s3.rendered.json:/etc/seaweedfs/s3.json:ro
  # Metrics and alert rules (counts only). Scrapes the API with a scoped metrics credential.
  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["127.0.0.1:9190:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./prometheus/prometheus.rendered.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/metrics.token.rendered:/etc/prometheus/metrics.token:ro
volumes:
  pgdata:
  redisdata:
  objdata:
